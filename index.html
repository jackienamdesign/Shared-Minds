<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Minds — Stream of Consciousness Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Vanta injects its own WebGL canvas in here -->
    <div id="vanta-bg"></div>

    <canvas id="consciousness-canvas"></canvas>

    <!-- React island: liquid glass thought field -->
    <div id="glass-field-root"></div>

    <!-- Overlay UI / HUD -->
    <header class="hud-header">
      <div class="brand">
        <span class="status-indicator"></span>
        <h1>Shared Minds</h1>
      </div>
      <p class="subtitle">Stream of Consciousness Canvas</p>
    </header>

    <footer class="hud-footer">
      <div class="pill">
        <span class="key-hint">Ready</span>
        <span>Click, drag, or type to interact</span>
      </div>
    </footer>
  </div>

  <!-- Vanta deps: three.js must be r134 — newer releases break Vanta's shaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.clouds.min.js"></script>

  <script src="main.js"></script>

  <!-- Resolves the bare "react" / "liquid-glass-react" imports in glass-field.js
       to CDN URLs, so no bundler is needed. ?external=react,react-dom keeps the
       library using the same React instance rather than bundling its own. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.1.0",
      "react/jsx-runtime": "https://esm.sh/react@19.1.0/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@19.1.0",
      "react-dom/client": "https://esm.sh/react-dom@19.1.0/client",
      "liquid-glass-react": "https://esm.sh/liquid-glass-react@1.1.1?external=react,react-dom"
    }
  }
  </script>
  <script type="module" src="glass-field.js"></script>
</body>
</html>
